# Fly.io deployment.
#
# One process runs both front ends: the Telegram bot on long polling, and the
# signing page on HTTP. They share a database connection and a render cache,
# and splitting them would mean running two machines to serve one drop.

app = "pfp-bot"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

# How long Fly waits after SIGTERM before sending SIGKILL, which cannot be
# caught and takes the process down wherever it happens to be.
#
# Fly's default is 5 seconds, and that is not enough here. A claim holds the
# project row lock for its whole transaction, and concurrent claimants queue
# behind it — insertClaim allows a transaction 20 seconds before giving up, so
# a claim that is legitimately mid-flight during a deploy can still be working
# well past the fifth second. At the default, a deploy timed against a busy
# moment would SIGKILL a member's claim after they had confirmed it: the row
# either committed or did not, nobody was told which, and the artwork on their
# screen may or may not be theirs.
#
# 30 seconds is comfortably past that ceiling, so an in-flight claim always
# reaches its own conclusion — commit or clean failure — before Fly stops
# being patient.
kill_timeout = "30s"

[env]
  NODE_ENV = "production"
  HTTP_PORT = "3000"
  # Inside the image rather than on a volume. Trait artwork therefore ships
  # with a deploy and changing it means deploying again, which is fine while
  # testing and is not how a live drop should run — see the note by [[vm]].
  TRAIT_ROOT = "/app/trait-packs"
  CLAIM_ROOT = "/app/output/claims"

[http_service]
  internal_port = 3000
  # Fly terminates TLS and redirects, so the signing page is https from the
  # outside without this process holding a certificate.
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  # Never zero. The bot polls Telegram continuously, so a machine that stopped
  # would stop answering members, not merely stop serving the page.
  #
  # Exactly one, and that ceiling matters as much as the floor. Telegram allows
  # a single long-polling connection per token, so a second machine does not
  # add redundancy — the two terminate each other's getUpdates with a 409 and
  # crash-loop, and the bot answers nobody while they do. Fly adds a second
  # machine for high availability unless told otherwise, so deploy with
  # `npm run deploy`, which passes --ha=false.
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    # Readiness rather than liveness. Fly uses this to decide whether to send
    # traffic here, and an instance that cannot reach its database should not
    # receive any — while still not being restarted, since restarting has
    # never been the fix for a database that is asleep.
    path = "/ready"

[[vm]]
  # The smallest size sharp and Node fit in comfortably. 256mb runs out of
  # memory compositing anything above a small canvas, and an out-of-memory
  # kill during a claim is the worst moment for one.
  size = "shared-cpu-1x"
  memory = "512mb"

# No volume, deliberately, and this is a testing posture rather than a
# finished one. Claimed artwork is reproducible from trait ids so losing it on
# deploy costs nothing but CPU; the trait pack is not reproducible, so it has
# to be rebuilt into the image every time it changes. Before a real drop this
# wants a volume back — a pack that only exists in an image is a pack one
# failed build away from gone.
